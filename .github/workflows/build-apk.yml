name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Capacitor
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest *.png app/www/
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "LogisticAdventure" "com.jasystom.logisticadventure" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icône, orientation portrait et version
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os, re, shutil
          res = 'app/android/app/src/main/res'
          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              ic = src.resize((s, s), Image.NEAREST)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  ic.save(f'{folder}/{name}')
          shutil.rmtree(f'{res}/mipmap-anydpi-v26', ignore_errors=True)
          m = 'app/android/app/src/main/AndroidManifest.xml'
          x = open(m).read()
          if 'screenOrientation' not in x:
              x = x.replace('<activity', '<activity android:screenOrientation="portrait"', 1)
          open(m, 'w').write(x)
          g = 'app/android/app/build.gradle'
          y = open(g).read()
          run = os.environ.get('GITHUB_RUN_NUMBER', '1')
          y = re.sub(r'versionCode \d+', f'versionCode {run}', y)
          y = re.sub(r'versionName "[^"]*"', f'versionName "1.{run}"', y)
          open(g, 'w').write(y)
          PY

      - name: Compiler l'APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../LogisticAdventure.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LogisticAdventure-apk
          path: LogisticAdventure.apk
